<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Road To Prime - Premium</title>

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        .premium-container {
            background: #111;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff7b00;
        }

        button {
            background: #8b00ff;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b300ff;
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #debugBox {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            word-break: break-word;
            white-space: pre-wrap;
            display: none;
        }

        @keyframes primeFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes primeGlow {
            0% { text-shadow: 0 0 0px #ff7b00; }
            100% { text-shadow: 0 0 15px #ff7b00; }
        }

        .prime-anim {
            animation: primeFade 1s ease-out, primeGlow 2s ease-in-out infinite alternate;
        }
    </style>
</head>

<body>

<script src="https://js.stripe.com/v3/"></script>

<div class="premium-container prime-anim">
    <h1 class="prime-anim">Hazte PREMIUM</h1>
    <p>Desbloquea todo el contenido de Road To Prime.</p>

    <h2>Plan PREMIUM</h2>
    <ul style="list-style:none; padding:0;">
        <li>✓ Lectura PRIME</li>
        <li>✓ Rutina PRIME</li>
        <li>✓ Acceso completo a todos los módulos</li>
        <li>✓ Actualizaciones exclusivas</li>
    </ul>

    <p id="precioTexto" style="font-size:20px; margin-top:10px;"></p>

    <button id="btnPagar" onclick="pagarPremium()">Activar PREMIUM</button>

    <div id="debugBox"></div>
</div>

<script>
// ===============================
// 🔥 OFERTA DEL 25 SEP → 25 OCT
// ===============================

const hoy = new Date();
const inicioOferta = new Date("2026-09-25");
const finOferta = new Date("2026-10-25");

let precio = 9.99;

if (hoy >= inicioOferta && hoy <= finOferta) {
    precio = 6.99;
}

document.getElementById("precioTexto").innerText = "Precio: " + precio + "€";

// ===============================
// 🔥 PAGO PREMIUM (CON DIAGNÓSTICO EN PANTALLA)
// ===============================

const URL_BACKEND = "https://backend-prime-production.up.railway.app/crear-pago";

function mostrarDebug(texto) {
    const box = document.getElementById("debugBox");
    box.style.display = "block";
    box.innerText = texto;
}

async function pagarPremium() {
    const boton = document.getElementById("btnPagar");
    boton.disabled = true;
    boton.innerText = "Conectando...";

    mostrarDebug("Intentando conectar a:\n" + URL_BACKEND);

    try {
        const respuesta = await fetch(URL_BACKEND, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ precio })
        });

        mostrarDebug(
            "✅ El fetch SÍ llegó al servidor.\n" +
            "Status HTTP: " + respuesta.status + "\n" +
            "OK: " + respuesta.ok
        );

        let datos;
        const textoRespuesta = await respuesta.text();

        try {
            datos = JSON.parse(textoRespuesta);
        } catch (parseError) {
            mostrarDebug(
                "⚠️ El servidor respondió pero NO es JSON válido.\n" +
                "Status: " + respuesta.status + "\n\n" +
                "Respuesta cruda del servidor:\n" + textoRespuesta.substring(0, 500)
            );
            boton.disabled = false;
            boton.innerText = "Activar PREMIUM";
            return;
        }

        if (!respuesta.ok) {
            mostrarDebug(
                "⚠️ El servidor respondió con error.\n" +
                "Status: " + respuesta.status + "\n" +
                "Contenido: " + JSON.stringify(datos, null, 2)
            );
            boton.disabled = false;
            boton.innerText = "Activar PREMIUM";
            return;
        }

        if (!datos.url) {
            mostrarDebug(
                "⚠️ El servidor respondió OK pero sin campo 'url'.\n" +
                "Contenido recibido: " + JSON.stringify(datos, null, 2)
            );
            boton.disabled = false;
            boton.innerText = "Activar PREMIUM";
            return;
        }

        mostrarDebug("✅ Todo correcto. Redirigiendo a Stripe...");
        window.location.href = datos.url;

    } catch (error) {
        mostrarDebug(
            "❌ EL FETCH FALLÓ ANTES DE LLEGAR AL SERVIDOR (o el navegador bloqueó la respuesta).\n\n" +
            "Nombre del error: " + error.name + "\n" +
            "Mensaje: " + error.message + "\n\n" +
            "Causas típicas: CORS bloqueado, backend caído, URL mal escrita, o sin conexión a internet."
        );
        boton.disabled = false;
        boton.innerText = "Activar PREMIUM";
    }
}
</script>

</body>
</html>
